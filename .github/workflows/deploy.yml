name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'
  repository_dispatch:
    types: [aftertone-release]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # 数据同步自身产生的提交不再重复构建
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[release-sync]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # 拉取最新发布数据；成功才提交，失败则保留上一版数据继续部署
      - name: Sync release data
        run: |
          npm run fetch:release
          if ! git diff --quiet -- src/data/releases.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/releases.json
            git commit -m "chore(release): sync release data [release-sync]"
            git push
          else
            echo "发布数据无变化"
          fi
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CF_PAGES_PROJECT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
